                items:
                  $ref: '#/components/schemas/Titlefy.Data.Entities.DTOs.PropertyDetailLite'
  /api/PropertyData/MarketAnalysis:
    get:
      tags:
      - PropertyData
      summary: Gets the market analysis based on the given zipcode.
      parameters:
      - name: zipCode
        in: query
        description: ''
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      responses:
        '200':
