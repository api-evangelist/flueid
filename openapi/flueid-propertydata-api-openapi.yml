openapi: 3.2.0
info:
  title: Flueid Pro Property Data API
  version: '1.0'
servers:
- url: https://api.pro.flueid.com
  description: Flueid Pro production API
tags:
- name: PropertyData
paths:
  /api/PropertyData/PropertySearchSuggestions:
    post:
      tags:
      - PropertyData
      summary: Gets suggestions matching the passed search text, within a certain geographic area.
      parameters:
      - name: api-version
        in: query
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/Titlefy.Models.PropertyData.PropertySearchSuggestionRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/Titlefy.Models.PropertyData.PropertySearchSuggestionRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/Titlefy.Models.PropertyData.PropertySearchSuggestionRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Titlefy.Models.PropertyData.PropertySearchSuggestionRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Flueid.PropertyDb.Models.PropertyData.PropSearchSuggestion'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Flueid.PropertyDb.Models.PropertyData.PropSearchSuggestion'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Flueid.PropertyDb.Models.PropertyData.PropSearchSuggestion'
  /api/PropertyData/PropertiesNearby:
    post:
      tags:
      - PropertyData
      summary: Gets all properties within a defined geographic box.
      parameters:
      - name: api-version
        in: query
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/Flueid.PropertyDb.Models.PropertyData.PropertiesNearbyRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/Flueid.PropertyDb.Models.PropertyData.PropertiesNearbyRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/Flueid.PropertyDb.Models.PropertyData.PropertiesNearbyRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Flueid.PropertyDb.Models.PropertyData.PropertiesNearbyRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Titlefy.Data.Entities.DTOs.PropertyDetailLite'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Titlefy.Data.Entities.DTOs.PropertyDetailLite'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Titlefy.Data.Entities.DTOs.PropertyDetailLite'
  /api/PropertyData/PropertyById:
    get:
      tags:
      - PropertyData
      summary: Gets a single property by id.
      parameters:
      - name: propertyId
        in: query
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: api-version
        in: query
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
