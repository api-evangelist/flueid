openapi: 3.2.0
info:
  title: Flueid Pro Orders API
  version: '1.0'
servers:
- url: https://api.pro.flueid.com
  description: Flueid Pro production API
tags:
- name: Orders
paths:
  /api/Orders/SearchOrders:
    post:
      tags:
      - Orders
      summary: Gets a list of orders that are viewable by the user.
      parameters:
      - name: api-version
        in: query
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/Titlefy.Data.Entities.DTOs.OrderSearchRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/Titlefy.Data.Entities.DTOs.OrderSearchRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/Titlefy.Data.Entities.DTOs.OrderSearchRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Titlefy.Data.Entities.DTOs.OrderSearchRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Titlefy.Data.Entities.DTOs.SearchOrdersResult'
            application/json:
              schema:
                $ref: '#/components/schemas/Titlefy.Data.Entities.DTOs.SearchOrdersResult'
            text/json:
              schema:
                $ref: '#/components/schemas/Titlefy.Data.Entities.DTOs.SearchOrdersResult'
  /api/Orders/OrderDetail:
    get:
      tags:
      - Orders
      summary: Gets the full detail of the order.
      parameters:
      - name: orderId
        in: query
        schema:
          type: integer
          format: int32
      - name: api-version
        in: query
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Titlefy.Data.Entities.DTOs.OrderDetailResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/Titlefy.Data.Entities.DTOs.OrderDetailResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/Titlefy.Data.Entities.DTOs.OrderDetailResponse'
  /api/Orders/RunFullUpdate:
    post:
      tags:
      - Orders
      summary: Performs a full update on the order.
      parameters:
      - name: api-version
        in: query
        description: The requested API version
