              $ref: '#/components/schemas/Titlefy.Models.Orders.OrderFullUpdateRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Titlefy.Models.Orders.OrderServiceSubmissionResult'
            application/json:
              schema:
                $ref: '#/components/schemas/Titlefy.Models.Orders.OrderServiceSubmissionResult'
            text/json:
