openapi: 3.2.0
info:
  title: Flueid Pro Farms API
  version: '1.0'
servers:
- url: https://api.pro.flueid.com
  description: Flueid Pro production API
tags:
- name: Farms
paths:
  /api/Farms/SearchFarmGeoPoints:
    post:
      tags:
      - Farms
      summary: Finds properties within a defined polygon.
      parameters:
      - name: api-version
        in: query
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Flueid.PropertyDb.Models.PropertyData.GeoPoint'
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Flueid.PropertyDb.Models.PropertyData.GeoPoint'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Flueid.PropertyDb.Models.PropertyData.GeoPoint'
          application/*+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Flueid.PropertyDb.Models.PropertyData.GeoPoint'
        required: true
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Titlefy.Data.Entities.DTOs.FarmGeoPoint'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Titlefy.Data.Entities.DTOs.FarmGeoPoint'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Titlefy.Data.Entities.DTOs.FarmGeoPoint'
  /api/Farms/SearchFarmProps:
    post:
      tags:
      - Farms
      summary: Finds properties within a defined polygon.
      parameters:
      - name: api-version
        in: query
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Flueid.PropertyDb.Models.PropertyData.GeoPoint'
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Flueid.PropertyDb.Models.PropertyData.GeoPoint'
          text/json:
            schema:
              type: array
