                type: string
            text/json:
              schema:
                type: string
  /api/Farms/UploadExcelFarm:
    post:
      tags:
      - Farms
      summary: Accepts a spreadsheet of properties and processes it to create a new farm.
      parameters:
      - name: api-version
        in: query
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
            encoding:
              file:
                style: form
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Titlefy.Models.Farms.FarmUploadResponse'
            application/json:
