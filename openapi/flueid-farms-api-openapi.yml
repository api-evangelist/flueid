      additionalProperties: false
    Titlefy.Data.Entities.DTOs.FarmGeoPoint:
      type: object
      properties:
        propertyId:
          type: integer
          format: int32
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
      additionalProperties: false
    Titlefy.Core.Constants.FarmPropertyLabel:
      enum:
      - 0
      - 1
      - 2
      - 3
      type: integer
      format: int32
    Titlefy.Data.Entities.FarmProperty:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/MongoDB.Bson.ObjectId'
        createdDate:
          type: string
          format: date-time
        createdByUser:
          type:
          - string
          - 'null'
        lastUpdatedDate:
          type: string
          format: date-time
        lastUpdatedByUser:
          type:
          - string
          - 'null'
        farmId:
          type: integer
          format: int32
        propertyId:
          type: integer
          format: int32
        label:
          $ref: '#/components/schemas/Titlefy.Core.Constants.FarmPropertyLabel'
        notes:
          type:
          - string
          - 'null'
        customer:
