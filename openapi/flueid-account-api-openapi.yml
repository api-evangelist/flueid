                  $ref: '#/components/schemas/Titlefy.Data.Entities.RelatedUser'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Titlefy.Data.Entities.RelatedUser'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Titlefy.Data.Entities.RelatedUser'
  /api/Account/SendUsersToDataWarehouse:
    post:
      tags:
