          application/json:
            schema:
              $ref: '#/components/schemas/Titlefy.Data.Entities.User'
          text/json:
            schema:
              $ref: '#/components/schemas/Titlefy.Data.Entities.User'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Titlefy.Data.Entities.User'
        required: true
      responses:
        '200':
          description: Success
      deprecated: true
  /api/Account/UpdateUserPhoto:
    post:
      tags:
      - Account
      summary: Updates the user's profile photo and returns the new url.
      parameters:
      - name: api-version
        in: query
        description: The requested API version
        schema:
          type: string
