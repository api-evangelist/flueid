          text/json:
            schema:
              $ref: '#/components/schemas/Titlefy.Models.Account.SearchOfficersOrAccountExecsRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Titlefy.Models.Account.SearchOfficersOrAccountExecsRequest'
        required: true
      responses:
        '200':
          description: Success
  /api/Account/PullUpCardContent:
