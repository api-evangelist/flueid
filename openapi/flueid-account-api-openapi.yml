        in: query
        description: ''
        schema:
          type: integer
          format: int32
      - name: endUserId
        in: query
        description: ''
        schema:
          type: integer
          format: int32
      - name: api-version
        in: query
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      responses:
        '200':
          description: Success
  /api/Account/SignUpUser:
    post:
      tags:
      - Account
      summary: Accepts the user sign-up information.
      parameters:
      - name: api-version
        in: query
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/Titlefy.Models.Account.SignUpRequest'
          application/json:
