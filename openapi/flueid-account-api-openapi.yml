        required: true
      responses:
        '200':
          description: Success
components:
  schemas:
    Titlefy.Data.Entities.AuthSettingsCollection:
      type: object
      properties:
        orders:
          $ref: '#/components/schemas/Titlefy.Data.Entities.OrdersAuthSettings'
        propertyData:
          $ref: '#/components/schemas/Titlefy.Data.Entities.PropertyDataAuthSettings'
        accounts:
          $ref: '#/components/schemas/Titlefy.Data.Entities.AccountsAuthSettings'
        quotes:
          $ref: '#/components/schemas/Titlefy.Data.Entities.QuotesSettings'
        generalAppSettings:
          $ref: '#/components/schemas/Titlefy.Data.Entities.GeneralAppSettings'
      additionalProperties: false
    Titlefy.Core.Constants.SortDirection:
      enum:
      - 0
      - 1
      - 2
      type: integer
      format: int32
    Titlefy.Data.Entities.HierarchySetting:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        value:
          type: boolean
        overrideLowerLevels:
          type: boolean
        preventOverrideByHigherLevels:
          type: boolean
        setByEntityType:
          $ref: '#/components/schemas/Flueid.Pro.Constants.EntityConstants.EntityType'
        setByEntityId:
          type: integer
          format: int32
      additionalProperties: false
    Titlefy.Data.Entities.UserPartnerCompany:
      type: object
      properties:
        companyName:
          type:
          - string
          - 'null'
        companyId:
          type: integer
          format: int32
        divisionId:
          type: integer
          format: int32
        branchId:
          type: integer
          format: int32
      additionalProperties: false
    Titlefy.Models.Account.UpdateProfilePhotoRequest:
      type: object
      properties:
        base64Content:
          type:
          - string
          - 'null'
      additionalProperties: false
    Titlefy.Data.Entities.DTOs.UserSettings:
      type: object
      properties:
        pullupCardContent:
          $ref: '#/components/schemas/Titlefy.Data.Entities.DTOs.PullupCardContent'
        authorizationSettings:
          $ref: '#/components/schemas/Titlefy.Data.Entities.AuthorizationSettings'
        permissions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Titlefy.Models.Permissions.SourcedPermission'
      additionalProperties: false
    Titlefy.Data.Entities.Branch:
      type: object
      properties:
        branchId:
          type: integer
          format: int32
        branchName:
          type:
          - string
          - 'null'
        address1:
          type:
          - string
          - 'null'
        address2:
          type:
          - string
          - 'null'
        city:
          type:
          - string
          - 'null'
        state:
          type:
          - string
          - 'null'
        zip:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
        license:
          type:
          - string
          - 'null'
      additionalProperties: false
    Titlefy.Models.Account.SignUpRequest:
      type: object
      properties:
        industryType:
          type: integer
          format: int32
        partnerId:
          type: integer
          format: int32
        accountManagers:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
        titleOfficers:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
        escrowOfficers:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
        companyId:
          type:
          - integer
          - 'null'
          format: int32
        divisionId:
          type:
          - integer
          - 'null'
          format: int32
        branchId:
          type:
          - integer
          - 'null'
          format: int32
        roles:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
        firstName:
          type:
          - string
          - 'null'
        lastName:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
        phoneWork:
          type:
          - string
          - 'null'
        licenseNumber:
          type:
          - string
          - 'null'
      additionalProperties: false
    Titlefy.Models.Account.SearchOfficersOrAccountExecsRequest:
      type: object
      properties:
        partnerId:
          type: integer
          format: int32
        roleId:
          type: integer
          format: int32
        searchText:
          type:
          - string
          - 'null'
      additionalProperties: false
    Titlefy.Data.Entities.OrdersAuthSettings:
      type: object
      properties:
        showOrdersSection:
          $ref: '#/components/schemas/Titlefy.Data.Entities.HierarchySetting'
        openOrders:
          $ref: '#/components/schemas/Titlefy.Data.Entities.HierarchySetting'
        canBeBusinessSource:
