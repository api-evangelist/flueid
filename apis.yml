apis:
- aid: flueid-pro
  name: Flueid Pro API
  description: 'The Flueid Pro API is the REST contract behind the Flueid Pro property
    research and lead-discovery workspace. It publishes an OpenAPI 3.0.1 document with
    132 operations across sixteen tags — Account, AccountPartner, ClientCompanies, Documents,
    Farms, NewOrders, OrderDocumentSettings, OrderEvents, OrderOptions, Orders, PartnerOrderSettings,
    Partners, Permissions, PropertyData, Public and Settings — covering title order intake
    and status, property data and tax-roll lookups, document image requests, farm (territory)
    definition and reporting, partner branding and order settings, and user/permission
    administration. Authentication is a bearer token issued by the Flueid Pro identity
    layer (AWS Cognito); the contract itself declares no securitySchemes.'
