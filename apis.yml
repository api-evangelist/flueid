aid: flueid
name: Flueid
description: 'Flueid is an Austin, Texas real estate technology company, founded in
  2017, that built the Verification of Title (VOT) category — digitizing the legacy
  title search, examination and underwriting risk process so title status can be returned
  as data rather than a manual report. Its platform spans Flueid Decision (the patented
  VOT decisioning engine used by mortgage lenders, servicers, title underwriters and
  secondary-market investors), Flueid Transact (workflow and settlement orchestration)
  and Flueid Pro (a property research, data and lead-discovery workspace for real estate
  agents, loan officers and title agents). Flueid Pro exposes a public OpenAPI 3.0.1
  contract at api.pro.flueid.com covering orders, property data, farms, partners, documents
  and account management; the Decision and Transact platform APIs are token-based partner
  integrations negotiated under contract rather than self-service.'
